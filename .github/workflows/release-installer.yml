name: Build and release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build application executable
        shell: pwsh
        run: .\build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile system-wide installer
        shell: pwsh
        run: |
          $isccCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $iscc "/DAppVersion=$version" "$env:GITHUB_WORKSPACE\installer\GPTTranscribe.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          name: GPT Transcribe ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/installer/GPTTranscribe-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
